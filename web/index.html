<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="积分小管家 —— 儿童习惯打卡与积分奖励">
  <meta name="theme-color" content="#F1F8E9">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="积分小管家">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>积分小管家</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 首帧前的兜底：CanvasKit / dart2js 下载期间先给一块米白底色 + 一行字，
       避免用户看到纯白屏误以为「打不开」。这段 DOM 在 Flutter 挂载后被覆盖。 */
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, #FDFFF9 0%, #F1F8E9 100%);
    }
    #kp-boot {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #3F6B2E;
    }
  </style>
</head>
<body>
  <div id="kp-boot">积分小管家正在加载…</div>
  <!-- Flutter 渲染出第一帧后会派发 `flutter-first-frame`；那时才移除占位，
       否则读屏软件会一直念「正在加载」。（Flutter 官方推荐的卸载时机。） -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('kp-boot');
      if (boot) boot.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
